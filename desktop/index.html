<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="AI 界面上的英文，一关一关记牢。84 个 AI 产品界面高频词，闯关式记忆，离线可用。">
<title>AI 英文小练</title>
<style>
:root{
  --bg:#f4f5fa; --card:#fff; --ink:#161a2b; --sub:#7c8394; --line:#e8eaf2;
  --primary:#5b5bd6; --primary2:#8b5cf6; --ok:#34b46b; --bad:#ef4d6a;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  overscroll-behavior-y:contain;
}
.app{max-width:620px;margin:0 auto;padding:26px 20px 72px;padding-bottom:calc(72px + env(safe-area-inset-bottom))}


/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{font-size:15px;font-weight:700;letter-spacing:.2px}
.brand em{font-style:normal;color:var(--sub);font-weight:500;font-size:12px;margin-left:8px}
.link{font-size:12px;color:var(--primary);background:none;border:0;cursor:pointer;padding:4px 0}
.link:hover{text-decoration:underline}

.view{display:none}
.view.on{display:block;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 主卡 */
.hero{
  background:linear-gradient(145deg,#4f46e5 0%,#7c3aed 52%,#a855f7 100%);
  border-radius:24px;padding:26px 24px 22px;color:#fff;
  box-shadow:0 16px 40px rgba(79,70,229,.26);
}
.hero-top{display:flex;align-items:center;justify-content:space-between}
.badge{font-size:11px;letter-spacing:1.5px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.18)}
.hero-num{font-size:12px;color:rgba(255,255,255,.78)}
.hero h1{margin:16px 0 0;font-size:26px;line-height:1.35;font-weight:700}
.hero p{margin:8px 0 0;font-size:13px;line-height:1.6;color:rgba(255,255,255,.82)}
.stats{display:flex;align-items:center;margin-top:18px;padding:14px 0;border-radius:14px;background:rgba(255,255,255,.12)}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:11px;color:rgba(255,255,255,.75)}
.vline{width:1px;height:24px;background:rgba(255,255,255,.22)}
.hero-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;
  height:46px;border:0;border-radius:14px;background:#fff;color:#4f46e5;
  font-size:15px;font-weight:700;cursor:pointer;transition:.15s;
}
.hero-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.12)}

/* 分区标题 */
.sec{display:flex;align-items:baseline;gap:10px;margin:30px 2px 12px}
.sec h2{margin:0;font-size:15px;font-weight:700}
.sec small{font-size:12px;color:#9aa1b1}

/* 分类网格 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{
  background:var(--card);border:1px solid transparent;border-radius:18px;padding:16px;
  cursor:pointer;transition:.16s;box-shadow:0 6px 20px rgba(22,26,43,.05);
}
.cat:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(22,26,43,.09);border-color:#e3e5f2}
.cat-top{display:flex;align-items:center;justify-content:space-between}
.cat-emoji{font-size:20px}
.cat-prog{font-size:11px;color:#9aa1b1}
.cat-name{display:block;margin-top:10px;font-size:14px;font-weight:600}
.cat-desc{display:block;margin-top:4px;font-size:11px;color:#8f96a6;line-height:1.5;height:34px}
.bar{margin-top:10px;height:4px;border-radius:999px;background:#eff1f7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .3s}

/* 功能入口 */
.entry{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid transparent;border-radius:18px;padding:14px 16px;
  margin-bottom:10px;cursor:pointer;font-family:inherit;transition:.16s;
  box-shadow:0 6px 18px rgba(22,26,43,.05);
}
.entry:hover{border-color:#e3e5f2;transform:translateY(-1px)}
.entry-ico{
  width:40px;height:40px;border-radius:12px;background:#f2f3fb;color:#5b5bd6;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;
}
.entry-main{flex:1;min-width:0}
.entry-main b{display:block;font-size:14px;font-weight:600}
.entry-main span{display:block;margin-top:2px;font-size:11.5px;color:#8f96a6}
.entry-arrow{color:#c6cbd8;font-size:18px}
.footnote{margin-top:26px;text-align:center;font-size:11px;color:#b3b9c7;line-height:1.8}

/* 答题 */
.hud{margin-bottom:18px}
.pbar{height:5px;border-radius:999px;background:#e8eaf2;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#5b5bd6,#a855f7);transition:width .3s}
.hudrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12px}
.hudrow .cnt{color:#5d6475;font-weight:600}
.hearts{letter-spacing:3px;font-size:13px;color:var(--bad)}
.hearts .off{color:#dfe2ec}
.score{color:var(--primary);font-weight:600}

.qcard{background:var(--card);border-radius:22px;padding:34px 24px 30px;text-align:center;box-shadow:0 10px 30px rgba(22,26,43,.07)}
.tag{display:inline-block;padding:5px 12px;border-radius:999px;background:#f1f1fd;color:#5b5bd6;font-size:11px;letter-spacing:.5px}
.qtext{margin:16px 0 0;font-size:32px;font-weight:700;line-height:1.3;word-break:break-word}
.qphon{margin-top:8px;font-size:13px;color:#9aa1b1}
.opts{margin-top:18px;display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:14px 16px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);
  transition:.15s;
}
.opt:hover:not(.locked){border-color:#cfd3e6;transform:translateY(-1px)}
.opt-key{
  width:26px;height:26px;border-radius:8px;background:#f3f4fa;color:#7c8394;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.opt-txt{flex:1;line-height:1.45}
.opt.right{background:#eefaf3;border-color:var(--ok)}
.opt.right .opt-key{background:var(--ok);color:#fff}
.opt.right .opt-txt{color:#14663a;font-weight:600}
.opt.wrong{background:#fdeff1;border-color:var(--bad)}
.opt.wrong .opt-key{background:var(--bad);color:#fff}
.opt.wrong .opt-txt{color:#a3162f;font-weight:600}
.opt.dim{opacity:.5}

.fb{margin-top:14px;background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:0 10px 30px rgba(20,24,42,.1);animation:in .18s ease-out}
.fb-head{display:flex;align-items:center;gap:10px}
.fb-ico{width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.fb-ico.ok{background:var(--ok)}
.fb-ico.no{background:var(--bad)}
.fb-title{font-size:13.5px;font-weight:600}
.combo{margin-left:auto;padding:3px 9px;border-radius:999px;background:#fff3e0;color:#c2410c;font-size:11px;font-weight:600}
.fb-word{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.fb-en{font-size:19px;font-weight:700}
.fb-phon{font-size:12px;color:#9aa1b1}
.fb-zh{font-size:13px;color:#4a5164;margin-top:2px}
.fb-ex{margin-top:10px;font-size:12.5px;line-height:1.6}
.fb-exzh{margin-top:3px;font-size:12px;line-height:1.6;color:#8f96a6}
.fb-note{margin-top:10px;padding:9px 12px;border-radius:10px;background:#f7f6ff;color:#5b5bd6;font-size:11.5px;line-height:1.6}
.btn{
  display:flex;align-items:center;justify-content:center;width:100%;height:46px;margin-top:16px;
  border:0;border-radius:14px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s;
}
.btn.primary{background:linear-gradient(135deg,#5b5bd6,#8b5cf6);color:#fff;box-shadow:0 10px 22px rgba(91,91,214,.26)}
.btn.primary:hover{transform:translateY(-1px)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:#3d4353}
.btn.ghost:hover{background:#f7f8fc}
.btn.slim{height:42px;font-size:13.5px}
.hint{margin-top:12px;text-align:center;font-size:11px;color:#b3b9c7}
kbd{display:inline-block;padding:1px 5px;border:1px solid #e0e3ee;border-bottom-width:2px;border-radius:5px;background:#fff;font-size:10px;color:#7c8394;font-family:inherit}

/* 结果 */
.rhero{background:linear-gradient(150deg,#4f46e5,#7c3aed 55%,#a855f7);border-radius:24px;padding:34px 24px 28px;text-align:center;color:#fff;box-shadow:0 16px 40px rgba(79,70,229,.26)}
.rhero .emo{font-size:38px;line-height:1}
.rhero h2{margin:12px 0 0;font-size:22px;font-weight:700}
.rhero p{margin:7px 0 0;font-size:13px;color:rgba(255,255,255,.82)}
.bigscore{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:16px}
.bigscore b{font-size:52px;font-weight:800;line-height:1;letter-spacing:-2px}
.bigscore span{font-size:13px;color:rgba(255,255,255,.8)}
.metrics{display:flex;align-items:center;background:var(--card);border-radius:18px;margin-top:14px;padding:18px 8px;box-shadow:0 8px 24px rgba(22,26,43,.06)}
.metric{flex:1;text-align:center}
.metric b{display:block;font-size:19px;font-weight:700}
.metric span{font-size:11px;color:#8f96a6}
.metric b.bad{color:var(--bad)}
.mlist{background:var(--card);border-radius:18px;padding:6px 18px;box-shadow:0 8px 24px rgba(22,26,43,.06)}
.mitem{padding:13px 0;border-bottom:1px solid #f3f4f9}
.mitem:last-child{border-bottom:0}
.mitem .en{font-size:14px;font-weight:600}
.mitem .ph{font-size:11px;color:#a3a9b6;margin-left:8px}
.mitem .zh{display:block;margin-top:3px;font-size:12px;color:#7c8394}

/* 词库 */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 14px;height:44px;box-shadow:0 6px 18px rgba(22,26,43,.05)}
.search input{flex:1;border:0;outline:0;background:none;font-family:inherit;font-size:13.5px;color:var(--ink);height:44px}
.search input::placeholder{color:#b3b9c7}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:6px 14px;border-radius:999px;background:#fff;border:1.5px solid #eceef5;color:#5d6475;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{border-color:#cfd3e6}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.count{margin:14px 2px 10px;font-size:11.5px;color:#9aa1b1}
.wcard{background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:9px;cursor:pointer;box-shadow:0 6px 18px rgba(22,26,43,.05);transition:.15s}
.wcard:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(22,26,43,.08)}
.wrow{display:flex;align-items:flex-start;gap:10px}
.wrow .en{font-size:15px;font-weight:700}
.lv{margin-left:8px;padding:2px 8px;border-radius:999px;font-size:10px;line-height:1.6;vertical-align:middle}
.lv.new{background:#f2f3f8;color:#8f96a6}
.lv.mid{background:#fff4e5;color:#b45309}
.lv.ok{background:#e9f9f0;color:#15803d}
.wcard .ph{display:block;margin-top:3px;font-size:11.5px;color:#a3a9b6}
.wcard .zh{display:block;margin-top:5px;font-size:13px;color:#4a5164}
.wcard .arrow{margin-left:auto;color:#c6cbd8;font-size:13px}
.detail{margin-top:12px;padding:12px 14px;border-radius:12px;background:#f7f8fc;font-size:12px;line-height:1.65}
.detail .ex{color:#2c3142}
.detail .exzh{margin-top:3px;color:#8f96a6}
.detail .note{margin-top:8px;color:#5b5bd6}
.detail .cat{margin-top:8px;font-size:10.5px;color:#b3b9c7}

/* 错题本 */
.mkhead{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(22,26,43,.06)}
.mkhead .row{display:flex;align-items:center;justify-content:space-between}
.mkhead b{font-size:30px;font-weight:800;line-height:1}
.mkhead span{font-size:12.5px;color:#7c8394;margin-left:8px}
.mkhead p{margin:10px 0 0;font-size:12px;color:#8f96a6;line-height:1.6}
.danger{padding:5px 12px;border-radius:999px;background:#fdeff1;color:#d62d4a;font-size:11.5px;border:0;cursor:pointer;font-family:inherit}
.mcard{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:9px;box-shadow:0 6px 18px rgba(22,26,43,.05)}
.rank{width:22px;height:22px;border-radius:50%;background:#f4f5fa;color:#9aa1b1;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:2px}
.mcard .en{font-size:15px;font-weight:700}
.mcard .times{margin-left:8px;padding:2px 8px;border-radius:999px;background:#fdeff1;color:#d62d4a;font-size:10px}
.mcard .ph{display:block;margin-top:3px;font-size:11.5px;color:#a3a9b6}
.mcard .zh{display:block;margin-top:4px;font-size:13px;color:#4a5164}
.mcard .ex{display:block;margin-top:5px;font-size:11.5px;color:#9aa1b1;line-height:1.5}

.empty{padding:56px 20px;text-align:center}
.empty .emo{font-size:34px;line-height:1}
.empty b{display:block;margin-top:12px;font-size:14px}
.empty p{margin:6px 0 0;font-size:12px;color:#8f96a6;line-height:1.6}

/* ---------- 手机适配 ---------- */
@media (max-width:480px){
  .app{padding:20px 16px;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .hero{padding:22px 20px 20px;border-radius:20px}
  .hero h1{font-size:23px}
  .hero p{font-size:13px}
  .qcard{padding:28px 18px 24px;border-radius:18px}
  .qtext{font-size:28px}
  .opt{padding:16px 14px;font-size:15px}
  .opt-key{width:28px;height:28px}
  .btn,.hero-btn{height:50px;font-size:15px}
  .grid{gap:10px}
  .cat{padding:14px}
  .cat-desc{height:auto;min-height:32px;font-size:11.5px}
  .fb{padding:16px}
  .fb-en{font-size:18px}
  .fb-ex{font-size:13px}
  .wcard{padding:16px 14px}
  .search{height:46px}
  .hint{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">AI 英文小练 <em>电脑版</em></div>
    <button class="link" id="navHome" type="button">返回首页</button>
  </div>

  <section class="view on" id="view-home"><div id="homeBody"></div></section>
  <section class="view" id="view-quiz"><div id="quizBody"></div></section>
  <section class="view" id="view-result"><div id="resultBody"></div></section>

  <section class="view" id="view-wordbook">
    <div class="search">
      <span>🔍</span>
      <input id="wbInput" type="text" placeholder="搜英文或中文，如 Generate、生成" autocomplete="off">
    </div>
    <div class="chips" id="wbChips"></div>
    <div class="count" id="wbCount"></div>
    <div id="wbList"></div>
  </section>

  <section class="view" id="view-mistakes"><div id="mkBody"></div></section>
</div>

<script>
/* ===== 词库数据（与小程序同源，由构建脚本注入） ===== */
const DATA = {"CATEGORIES":[{"id":"action","name":"按钮与操作","desc":"界面上最常点的那些词","emoji":"👆","color":"#5b5bd6"},{"id":"setting","name":"模型与参数","desc":"设置面板里的关键词","emoji":"🎛️","color":"#0f9d8f"},{"id":"prompt","name":"提示词","desc":"和模型对话时的用语","emoji":"💬","color":"#c2410c"},{"id":"chat","name":"对话与界面","desc":"会话、记录、附件相关","emoji":"🗂️","color":"#2563eb"},{"id":"billing","name":"计费与限制","desc":"套餐、额度、限流","emoji":"💳","color":"#7c3aed"},{"id":"quality","name":"回答与质量","desc":"判断答案靠不靠谱","emoji":"🔍","color":"#be123c"}],"WORDS":[{"id":"generate","en":"Generate","phonetic":"/ˈdʒenəreɪt/","zh":"生成","cat":"action","example":"Click Generate to create a new response.","exampleZh":"点击 Generate 生成一条新回复。","note":"最核心的按钮，等价于「让模型开始干活」。"},{"id":"regenerate","en":"Regenerate","phonetic":"/ˌriːˈdʒenəreɪt/","zh":"重新生成","cat":"action","example":"Not satisfied? Hit Regenerate for another answer.","exampleZh":"不满意？点 Regenerate 换一个答案。","note":"re- 前缀表示「再一次」，答案不喜欢就用它。"},{"id":"submit","en":"Submit","phonetic":"/səbˈmɪt/","zh":"提交","cat":"action","example":"Submit the form to finish your profile.","exampleZh":"提交表单以完成你的资料。","note":"比 Send 更正式，多用于表单、申请。"},{"id":"cancel","en":"Cancel","phonetic":"/ˈkænsl/","zh":"取消","cat":"action","example":"Press Cancel to leave without saving.","exampleZh":"点 Cancel 可以放弃保存直接离开。"},{"id":"retry","en":"Retry","phonetic":"/ˌriːˈtraɪ/","zh":"重试","cat":"action","example":"The request failed. Please retry.","exampleZh":"请求失败，请重试。"},{"id":"confirm","en":"Confirm","phonetic":"/kənˈfɜːrm/","zh":"确认","cat":"action","example":"Confirm your email to activate the account.","exampleZh":"确认邮箱以激活账号。"},{"id":"copy","en":"Copy","phonetic":"/ˈkɑːpi/","zh":"复制","cat":"action","example":"Copy the prompt and paste it into another tool.","exampleZh":"复制提示词，粘贴到另一个工具里。"},{"id":"paste","en":"Paste","phonetic":"/peɪst/","zh":"粘贴","cat":"action","example":"Paste your text here to summarize it.","exampleZh":"把文本粘贴到这里来做摘要。"},{"id":"clear","en":"Clear","phonetic":"/klɪr/","zh":"清空","cat":"action","e /* ===== 常量与工具 ===== */
const LETTERS = ['A', 'B', 'C', 'D'];
const MAX_LIVES = 3;
const Q_COUNT = 10;
const WORDS = DATA.WORDS;
const CATS = DATA.CATEGORIES;

const WORD_MAP = {};
for (let i = 0; i < WORDS.length; i++) WORD_MAP[WORDS[i].id] = WORDS[i];
const CAT_MAP = {};
for (let i = 0; i < CATS.length; i++) CAT_MAP[CATS[i].id] = CATS[i];

const $ = function (id) { return document.getElementById(id); };

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function shuffle(list) {
  const arr = list.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function uniq(list, field, exclude) {
  const seen = {};
  const out = [];
  for (let i = 0; i < list.length; i++) {
    const v = list[i][field];
    if (!v || v === exclude || seen[v]) continue;
    seen[v] = true; out.push(v);
  }
  return out;
}

/* ===== 出题（与小程序逻辑一致） ===== */
function buildQuestions(pool, backup, count, optionCount) {
  const size = optionCount || 4;
  const source = pool && pool.length ? pool : backup;
  const total = Math.min(count || 10, source.length);
  const picked = shuffle(source).slice(0, total);
  const out = [];

  for (let i = 0; i < picked.length; i++) {
    const w = picked[i];
    const isEn2Zh = i % 2 === 0;
    const answer = isEn2Zh ? w.zh : w.en;
    const field = isEn2Zh ? 'zh' : 'en';

    let others = uniq(source, field, answer);
    if (others.length < size - 1) {
      const extra = uniq(backup || [], field, answer);
      for (let k = 0; k < extra.length; k++) {
        if (others.indexOf(extra[k]) === -1) others.push(extra[k]);
      }
    }
    const distractors = shuffle(others).slice(0, size - 1);
    const options = shuffle(distractors.concat([answer]));
    let answerIndex = 0;
    for (let k = 0; k < options.length; k++) {
      if (options[k] === answer) { answerIndex = k; break; }
    }

    out.push({
      wordId: w.id,
      type: isEn2Zh ? 'en2zh' : 'zh2en',
      typeLabel: isEn2Zh ? '选出中文意思' : '选出英文单词',
      promptText: isEn2Zh ? w.en : w.zh,
      promptSub: isEn2Zh ? w.phonetic : '请选出对应的英文',
      options: options,
      answerIndex: answerIndex,
      w: w
    });
  }
  return out;
}

function scoreOf(combo) { return 10 + Math.min(combo * 2, 10); }

/* ===== 本地存储 ===== */
const K = { stats: 'aiwords_stats_v1', mistakes: 'aiwords_mistakes_v1', mastery: 'aiwords_mastery_v1' };

function readK(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const val = JSON.parse(raw);
    return val == null ? fallback : val;
  } catch (e) { return fallback; }
}
function writeK(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { return false; }
}
function getStats() {
  return Object.assign({ totalAnswered: 0, totalCorrect: 0, bestCombo: 0, plays: 0, bestScore: 0 }, readK(K.stats, {}));
}
function getMistakes() { return readK(K.mistakes, {}); }
function getMastery() { return readK(K.mastery, {}); }

function recordAnswer(wordId, isCorrect) {
  const mastery = getMastery();
  const item = mastery[wordId] || { right: 0, wrong: 0 };
  if (isCorrect) item.right++; else item.wrong++;
  mastery[wordId] = item;
  writeK(K.mastery, mastery);

  const mistakes = getMistakes();
  if (isCorrect) {
    if (mistakes[wordId]) {
      const left = (mistakes[wordId].count || 1) - 1;
      if (left <= 0) delete mistakes[wordId];
      else mistakes[wordId] = { count: left, at: Date.now() };
    }
  } else {
    const prev = mistakes[wordId] || { count: 0 };
    mistakes[wordId] = { count: (prev.count || 0) + 1, at: Date.now() };
  }
  writeK(K.mistakes, mistakes);
}

function recordQuiz(p) {
  const s = getStats();
  s.totalAnswered += p.total || 0;
  s.totalCorrect += p.correct || 0;
  s.plays += 1;
  if ((p.bestCombo || 0) > s.bestCombo) s.bestCombo = p.bestCombo;
  if ((p.score || 0) > s.bestScore) s.bestScore = p.score;
  writeK(K.stats, s);
}

function overview() {
  const mastery = getMastery();
  const s = getStats();
  let learned = 0;
  for (const id in mastery) if (mastery[id] && mastery[id].right > 0) learned++;
  return {
    learned: learned,
    total: WORDS.length,
    accuracy: s.totalAnswered ? Math.round(s.totalCorrect / s.totalAnswered * 100) : 0,
    bestCombo: s.bestCombo,
    plays: s.plays
  };
}

function resetAll() {
  if (!confirm('确定清空全部学习记录吗？包括进度、正确率和错题本。此操作不可撤销。')) return;
  try {
    localStorage.removeItem(K.stats);
    localStorage.removeItem(K.mistakes);
    localStorage.removeItem(K.mastery);
  } catch (e) {}
  renderHome();
  alert('已清空');
}

/* ===== 路由 ===== */
const S = { view: 'home' };

function show(view) {
  const all = document.querySelectorAll('.view');
  for (let i = 0; i < all.length; i++) all[i].classList.remove('on');
  const el = $('view-' + view);
  if (el) el.classList.add('on');
  S.view = view;
  window.scrollTo(0, 0);
  $('navHome').style.visibility = view === 'home' ? 'hidden' : 'visible';
}

/* ===== 首页 ===== */
function renderHome() {
  const o = overview();
  const mastery = getMastery();
  const mistakes = getMistakes();

  let catsHtml = '';
  for (let i = 0; i < CATS.length; i++) {
    const c = CATS[i];
    let total = 0, learned = 0;
    for (let k = 0; k < WORDS.length; k++) {
      if (WORDS[k].cat !== c.id) continue;
      total++;
      const r = mastery[WORDS[k].id];
      if (r && r.right > 0) learned++;
    }
    const pct = total ? Math.round(learned / total * 100) : 0;
    catsHtml +=
      '<div class="cat" data-cat="' + c.id + '">' +
        '<div class="cat-top"><span class="cat-emoji">' + c.emoji + '</span>' +
        '<span class="cat-prog">' + learned + '/' + total + '</span></div>' +
        '<b class="cat-name">' + esc(c.name) + '</b>' +
        '<span class="cat-desc">' + esc(c.desc) + '</span>' +
        '<div class="bar"><i style="width:' + pct + '%;background:' + c.color + '"></i></div>' +
      '</div>';
  }

  const mkCount = Object.keys(mistakes).length;

  $('homeBody').innerHTML =
    '<div class="hero">' +
      '<div class="hero-top"><span class="badge">AI 界面英文 · 闯关</span>' +
      '<span class="hero-num" id="hvNum">' + o.learned + '/' + o.total + '</span></div>' +
      '<h1>看懂界面上的每一个按钮</h1>' +
      '<p>每关 10 题，3 次机会。答对连击越多，分数越高。</p>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + o.learned + '</b><span>已学词</span></div>' +
        '<div class="vline"></div>' +
        '<div class="stat"><b>' + o.accuracy + '%</b><span>正确率</span></div>' +
        '<div class="vline"></div>' +
        '<div class="stat"><b>' + o.bestCombo + '</b><span>最高连击</span></div>' +
      '</div>' +
      '<button class="hero-btn" id="btnStart" type="button">开始闯关 <span>→</span></button>' +
    '</div>' +
    '<div class="sec"><h2>选择分类</h2><small>按场景专项练习</small></div>' +
    '<div class="grid" id="catGrid">' + catsHtml + '</div>' +
    '<div class="sec"><h2>更多</h2></div>' +
    '<button class="entry" id="btnWordbook" type="button">' +
      '<span class="entry-ico">📖</span>' +
      '<span class="entry-main"><b>完整词库</b><span>支持搜索，含音标和例句</span></span>' +
      '<span class="entry-arrow">›</span></button>' +
    '<button class="entry" id="btnMistakes" type="button">' +
      '<span class="entry-ico">🔁</span>' +
      '<span class="entry-main"><b>错题本</b><span>' + mkCount + ' 个词还没拿下</span></span>' +
      '<span class="entry-arrow">›</span></button>' +
    '<div class="footnote">数据只存在这台电脑的浏览器里，不上传、不联网<br>' +
      '<button class="link" id="btnReset" type="button" style="margin-top:6px">清空所有记录</button></div>';

  $('btnStart').onclick = function () { startQuiz('all'); };
  $('btnWordbook').onclick = function () { show('wordbook'); renderWordbook(); };
  $('btnMistakes').onclick = function () { show('mistakes'); renderMistakes(); };
  $('btnReset').onclick = resetAll;

  const catEls = document.querySelectorAll('#catGrid .cat');
  for (let i = 0; i < catEls.length; i++) {
    catEls[i].onclick = function () { startQuiz(this.getAttribute('data-cat')); };
  }
}

/* ===== 答题 ===== */
const Q = { cat: 'all', list: [], idx: 0, score: 0, combo: 0, maxCombo: 0, lives: MAX_LIVES, correct: 0, answered: false, selected: -1, wrong: [] };

function poolOf(catId) {
  if (catId === 'all') return WORDS;
  const out = [];
  for (let i = 0; i < WORDS.length; i++) if (WORDS[i].cat === catId) out.push(WORDS[i]);
  return out;
}

function startQuiz(catId) {
  const pool = poolOf(catId);
  Q.cat = catId;
  Q.list = buildQuestions(pool, WORDS, Q_COUNT, 4);
  Q.idx = 0; Q.score = 0; Q.combo = 0; Q.maxCombo = 0;
  Q.lives = MAX_LIVES; Q.correct = 0; Q.answered = false; Q.selected = -1; Q.wrong = [];
  show('quiz');
  renderQuiz();
}

function heartsHtml() {
  let h = '';
  for (let i = 0; i < MAX_LIVES; i++) {
    h += '<span' + (i < Q.lives ? '' : ' class="off"') + '>♥</span>';
  }
  return h;
}

function renderQuiz() {
  const q = Q.list[Q.idx];
  if (!q) { $('quizBody').innerHTML = ''; return; }

  const pct = Math.round(Q.idx / Q.list.length * 100);
  let optHtml = '';
  for (let i = 0; i < q.options.length; i++) {
    let cls = 'opt';
    if (Q.answered) {
      cls += ' locked';
      if (i === q.answerIndex) cls += ' right';
      else if (i === Q.selected) cls += ' wrong';
      else cls += ' dim';
    }
    optHtml += '<button class="' + cls + '" type="button" data-i="' + i + '">' +
      '<span class="opt-key">' + LETTERS[i] + '</span>' +
      '<span class="opt-txt">' + esc(q.options[i]) + '</span></button>';
  }

  let fbHtml = '';
  if (Q.answered) {
    const w = q.w;
    fbHtml =
      '<div class="fb">' +
        '<div class="fb-head">' +
          '<span class="fb-ico ' + (Q.selected === q.answerIndex ? 'ok' : 'no') + '">' + (Q.selected === q.answerIndex ? '✓' : '✕') + '</span>' +
          '<span class="fb-title">' + (Q.selected === q.answerIndex ? '答对了 +' + scoreOf(Q.combo) : '正确答案是这样') + '</span>' +
          (Q.combo > 1 ? '<span class="combo">' + Q.combo + ' 连击</span>' : '') +
        '</div>' +
        '<div class="fb-word"><span class="fb-en">' + esc(w.en) + '</span><span class="fb-phon">' + esc(w.phonetic) + '</span></div>' +
        '<div class="fb-zh">' + esc(w.zh) + '</div>' +
        '<div class="fb-ex">' + esc(w.example) + '</div>' +
        '<div class="fb-exzh">' + esc(w.exampleZh) + '</div>' +
        (w.note ? '<div class="fb-note">💡 ' + esc(w.note) + '</div>' : '') +
        '<button class="btn primary" id="btnNext" type="button">' + nextLabel() + '</button>' +
      '</div>';
  }

  $('quizBody').innerHTML =
    '<div class="hud">' +
      '<div class="pbar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="hudrow">' +
        '<span class="cnt">' + (Q.idx + 1) + '/' + Q.list.length + '</span>' +
        '<span class="hearts">' + heartsHtml() + '</span>' +
        '<span class="score">' + Q.score + ' 分</span>' +
      '</div>' +
    '</div>' +
    '<div class="qcard">' +
      '<span class="tag">' + q.typeLabel + '</span>' +
      '<div class="qtext">' + esc(q.promptText) + '</div>' +
      '<div class="qphon">' + esc(q.promptSub) + '</div>' +
    '</div>' +
    '<div class="opts" id="optBox">' + optHtml + '</div>' +
    fbHtml +
    '<div class="hint">按 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 选择 · <kbd>Enter</kbd> 下一题 · <kbd>Esc</kbd> 回首页</div>';

  const btns = document.querySelectorAll('#optBox .opt');
  for (let i = 0; i < btns.length; i++) {
    btns[i].onclick = function () { answer(Number(this.getAttribute('data-i'))); };
  }
  const nb = $('btnNext');
  if (nb) nb.onclick = next;
}

function nextLabel() {
  const isLast = Q.idx + 1 >= Q.list.length;
  return (isLast || Q.lives <= 0) ? '查看结果' : '下一题';
}

function answer(i) {
  if (Q.answered) return;
  const q = Q.list[Q.idx];
  const isCorrect = i === q.answerIndex;
  Q.selected = i;
  Q.answered = true;

  if (isCorrect) {
    Q.combo++;
    if (Q.combo > Q.maxCombo) Q.maxCombo = Q.combo;
    Q.score += scoreOf(Q.combo);
    Q.correct++;
  } else {
    Q.combo = 0;
    Q.lives--;
    Q.wrong.push({ id: q.wordId, en: q.w.en, zh: q.w.zh, phonetic: q.w.phonetic });
  }
  recordAnswer(q.wordId, isCorrect);
  renderQuiz();
}

function next() {
  if (Q.idx + 1 >= Q.list.length || Q.lives <= 0) { finish(); return; }
  Q.idx++;
  Q.answered = false;
  Q.selected = -1;
  renderQuiz();
  window.scrollTo(0, 0);
}

function finish() {
  const answered = Q.idx + 1;
  const total = Q.list.length;
  const accuracy = answered ? Math.round(Q.correct / answered * 100) : 0;
  const cleared = Q.lives > 0 && answered >= total;

  recordQuiz({ total: answered, correct: Q.correct, score: Q.score, bestCombo: Q.maxCombo });

  let emoji = '💪', title = '再练一关就稳了';
  if (cleared && accuracy === 100) { emoji = '🏆'; title = '全对，太强了'; }
  else if (cleared) { emoji = '🎉'; title = '通关成功'; }
  else if (Q.lives <= 0) { emoji = '😵'; title = '机会用完了'; }

  const sub = Q.wrong.length === 0 ? '这一关没有错题，完美。'
    : '答对 ' + Q.correct + ' 题，错 ' + Q.wrong.length + ' 题';

  let wrongHtml = '';
  if (Q.wrong.length) {
    let items = '';
    for (let i = 0; i < Q.wrong.length; i++) {
      const w = Q.wrong[i];
      items += '<div class="mitem"><span class="en">' + esc(w.en) + '</span>' +
        '<span class="ph">' + esc(w.phonetic) + '</span>' +
        '<span class="zh">' + esc(w.zh) + '</span></div>';
    }
    wrongHtml = '<div class="sec"><h2>这一关错的词</h2><small>' + Q.wrong.length + ' 个已进错题本</small></div>' +
      '<div class="mlist">' + items + '</div>';
  }

  $('resultBody').innerHTML =
    '<div class="rhero">' +
      '<div class="emo">' + emoji + '</div>' +
      '<h2>' + title + '</h2>' +
      '<p>' + sub + '</p>' +
      '<div class="bigscore"><b>' + Q.score + '</b><span>分</span></div>' +
    '</div>' +
    '<div class="metrics">' +
      '<div class="metric"><b>' + Q.correct + '</b><span>答对</span></div>' +
      '<div class="vline" style="background:#eff1f7"></div>' +
      '<div class="metric"><b class="bad">' + Q.wrong.length + '</b><span>答错</span></div>' +
      '<div class="vline" style="background:#eff1f7"></div>' +
      '<div class="metric"><b>' + Q.maxCombo + '</b><span>最高连击</span></div>' +
      '<div class="vline" style="background:#eff1f7"></div>' +
      '<div class="metric"><b>' + accuracy + '%</b><span>正确率</span></div>' +
    '</div>' +
    wrongHtml +
    '<button class="btn primary" id="btnAgain" type="button">再来一关</button>' +
    '<button class="btn ghost slim" id="btnBack" type="button">回到首页</button>' +
    '<div class="hint">按 <kbd>Enter</kbd> 再来一关</div>';

  $('btnAgain').onclick = function () { startQuiz(Q.cat); };
  $('btnBack').onclick = goHome;
  show('result');
}

function goHome() { show('home'); renderHome(); }

/* ===== 词库 ===== */
const W = { kw: '', cat: 'all', open: null, built: false };

function renderWordbook() {
  if (!W.built) {
    let chips = '<button class="chip on" type="button" data-c="all">全部</button>';
    for (let i = 0; i < CATS.length; i++) {
      chips += '<button class="chip" type="button" data-c="' + CATS[i].id + '">' + esc(CATS[i].name) + '</button>';
    }
    $('wbChips').innerHTML = chips;
    const cs = document.querySelectorAll('#wbChips .chip');
    for (let i = 0; i < cs.length; i++) {
      cs[i].onclick = function () {
        W.cat = this.getAttribute('data-c');
        const all = document.querySelectorAll('#wbChips .chip');
        for (let k = 0; k < all.length; k++) all[k].classList.toggle('on', all[k] === this);
        renderWordbookList();
      };
    }
    $('wbInput').addEventListener('input', function () {
      W.kw = this.value;
      renderWordbookList();
    });
    W.built = true;
  }
  renderWordbookList();
}

function renderWordbookList() {
  const kw = (W.kw || '').trim().toLowerCase();
  const mastery = getMastery();
  const list = [];

  for (let i = 0; i < WORDS.length; i++) {
    const w = WORDS[i];
    if (W.cat !== 'all' && w.cat !== W.cat) continue;
    if (kw) {
      const hitEn = w.en.toLowerCase().indexOf(kw) > -1;
      const hitZh = w.zh.indexOf(kw) > -1;
      if (!hitEn && !hitZh) continue;
    }
    list.push(w);
  }

  $('wbCount').textContent = '共 ' + list.length + ' 个词';

  if (!list.length) {
    $('wbList').innerHTML = '<div class="empty"><div class="emo">🔍</div><b>没有匹配的词</b><p>换个关键词，或点「全部」看看。</p></div>';
    return;
  }

  let html = '';
  for (let i = 0; i < list.length; i++) {
    const w = list[i];
    const r = mastery[w.id];
    let lv = '<span class="lv new">未学</span>';
    if (r && r.right >= 2) lv = '<span class="lv ok">已掌握</span>';
    else if (r && r.right > 0) lv = '<span class="lv mid">学过</span>';

    let detail = '';
    if (W.open === w.id) {
      const c = CAT_MAP[w.cat];
      detail = '<div class="detail">' +
        '<div class="ex">' + esc(w.example) + '</div>' +
        '<div class="exzh">' + esc(w.exampleZh) + '</div>' +
        (w.note ? '<div class="note">💡 ' + esc(w.note) + '</div>' : '') +
        '<div class="cat">分类：' + esc(c ? c.name : '') + '</div>' +
      '</div>';
    }

    html += '<div class="wcard" data-id="' + w.id + '">' +
      '<div class="wrow"><div style="flex:1;min-width:0">' +
        '<span class="en">' + esc(w.en) + '</span>' + lv +
        '<span class="ph">' + esc(w.phonetic) + '</span>' +
      '</div><span class="arrow">' + (W.open === w.id ? '⌃' : '⌄') + '</span></div>' +
      '<span class="zh">' + esc(w.zh) + '</span>' +
      detail +
    '</div>';
  }
  $('wbList').innerHTML = html;

  const cards = document.querySelectorAll('#wbList .wcard');
  for (let i = 0; i < cards.length; i++) {
    cards[i].onclick = function () {
      const id = this.getAttribute('data-id');
      W.open = W.open === id ? null : id;
      renderWordbookList();
    };
  }
}

/* ===== 错题本 ===== */
function renderMistakes() {
  const mistakes = getMistakes();
  const ids = Object.keys(mistakes);
  const list = [];
  for (let i = 0; i < ids.length; i++) {
    const w = WORD_MAP[ids[i]];
    if (!w) continue;
    list.push({ w: w, count: (mistakes[ids[i]] || {}).count || 1 });
  }
  list.sort(function (a, b) { return b.count - a.count; });

  if (!list.length) {
    $('mkBody').innerHTML =
      '<div class="empty"><div class="emo">✨</div><b>错题本是空的</b>' +
      '<p>要么你还没开始练，要么你已经全对了。</p>' +
      '<button class="btn primary" id="mkGo" type="button" style="max-width:220px;margin:18px auto 0">去闯一关</button></div>';
    $('mkGo').onclick = goHome;
    return;
  }

  let items = '';
  for (let i = 0; i < list.length; i++) {
    const it = list[i];
    items += '<div class="mcard">' +
      '<div class="rank">' + (i + 1) + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<span class="en">' + esc(it.w.en) + '</span>' +
        '<span class="times">错 ' + it.count + ' 次</span>' +
        '<span class="ph">' + esc(it.w.phonetic) + '</span>' +
        '<span class="zh">' + esc(it.w.zh) + '</span>' +
        '<span class="ex">' + esc(it.w.example) + '</span>' +
      '</div></div>';
  }

  $('mkBody').innerHTML =
    '<div class="mkhead">' +
      '<div class="row"><div><b>' + list.length + '</b><span>个词待巩固</span></div>' +
      '<button class="danger" id="mkClear" type="button">清空</button></div>' +
      '<p>答对一次，这个词就会从错题本里减一次。</p>' +
      '<button class="btn primary slim" id="mkPractice" type="button">重练这些词</button>' +
    '</div>' +
    '<div class="sec"><h2>按错误次数排序</h2></div>' +
    items;

  $('mkPractice').onclick = function () {
    Q.cat = 'all';
    const pool = [];
    for (let i = 0; i < list.length; i++) pool.push(list[i].w);
    Q.list = buildQuestions(pool, WORDS, Math.min(10, pool.length), 4);
    Q.idx = 0; Q.score = 0; Q.combo = 0; Q.maxCombo = 0;
    Q.lives = MAX_LIVES; Q.correct = 0; Q.answered = false; Q.selected = -1; Q.wrong = [];
    show('quiz');
    renderQuiz();
  };

  $('mkClear').onclick = function () {
    if (!confirm('清空错题本？学习统计不受影响。')) return;
    writeK(K.mistakes, {});
    renderMistakes();
  };
}

/* ===== 键盘操作 ===== */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (S.view !== 'home') { goHome(); }
    return;
  }
  if (S.view === 'quiz') {
    if (!Q.answered && ['1', '2', '3', '4'].indexOf(e.key) > -1) {
      const i = Number(e.key) - 1;
      const q = Q.list[Q.idx];
      if (q && i < q.options.length) { e.preventDefault(); answer(i); }
      return;
    }
    if (Q.answered && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      next();
      return;
    }
  }
  if (S.view === 'result' && e.key === 'Enter') {
    e.preventDefault();
    startQuiz(Q.cat);
  }
});

$('navHome').onclick = goHome;

/* ===== 启动 ===== */
show('home');
renderHome();
</script>
</body>
</html>
